[project]
name = "AgentSmith"
version = "0.1.0"
description = "An autonomous AI agent capable of reasoning, generating, executing, and iterating on code to solve programming challenges in a secure, sandboxed environment. "
readme = "README.md"
requires-python = ">=3.10, <3.11"
authors = [
	{"name" = "ayhirose", "email" = "ayhirose@student.42tokyo.jp"},
	{"name" = "nsato", "email" = "nsato@student.42tokyo.jp"},
	{"name" = "joseo", "email" = "joseo@student.42tokyo.jp"}
]

# これがないとプログラム実行時にエラー。
dependencies = [
	"fire>=0.7.1",
	"pydantic>=2.12.5",
	"pydantic-settings>=2.15.0",
	"python-dotenv>=1.2.4",
	"requests",
]
# 実行ロジックに違いはないが、開発、テスト、静的解析に必要。
[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "flake8-bugbear>=25.11.29",
    "flake8-pyproject",
    "mypy>=1.19.1",
    "pep8-naming>=0.15.1",
    "pytest",
	"flake8-docstrings",
]

[tool.mypy]
exclude = [
    "^\\.venv/",
	"test/"
]

# .関数はAnyで返せなくなる
warn_return_any = true

# .type: ignoreを警告する
warn_unused_ignores = true

# .外部ライブラリは検証外にする
ignore_missing_imports = true

# .型ヒントのない関数を警告する
disallow_untyped_defs = true

# .型ヒントのない関数の中身を検証する
check_untyped_defs = true

# strict = true

[tool.flake8]
docstring-convention = "google"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "__init__.py",
	"test",
	"dist",
	"build",
]
max-line-length = 130

# コマンド名 = モジュールの場所:関数名
[project.scripts]
sandbox = "src.sandbox.sandbox_main:main"

# このプロジェクトはパッケージとして扱い、uv syncでプロジェクト自体を.venvにインストール
[tool.uv]
package = true

# このプロジェクトをビルドする時はhatchlingを使う
[build-system]
# .venvではなく一時的な環境にhatchlingを入れる
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchlingにwheelに入れるのはsrc/パッケージと指定
# 書かれていないとプロジェクト名(agentsmith)から探す
[tool.hatch.build.targets.wheel]
packages = ["src"]
